<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weather Dashboard - Check current weather and 5-day forecasts">
    <title>Weather Dashboard</title>


    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Check current weather and upcoming forecasts</p>
        </div>
    </header>

    <main class="container">

        <section class="search-section">
            <form id="weatherForm">
                <label for="cityInput">Search for a city</label>

                <div class="search-box">
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="searchButton">
                        Search
                    </button>
                </div>
            </form>

            <p id="errorMessage" class="error-message"></p>
        </section>

        <section id="loading" class="loading hidden">
            <p>Loading weather data...</p>
        </section>

        <section id="currentWeather" class="weather-card hidden">

            <div class="weather-header">
                <div>
                    <h2 id="cityName">Colombo</h2>
                    <p id="currentDate">Today</p>
                </div>

                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather condition">
                </div>
            </div>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="weatherDescription">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>🌡️</span>
                    <div>
                        <small>Feels Like</small>
                        <strong id="feelsLike">--°C</strong>
                    </div>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <div>
                        <small>Humidity</small>
                        <strong id="humidity">--%</strong>
                    </div>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <div>
                        <small>Wind Speed</small>
                        <strong id="windSpeed">-- m/s</strong>
                    </div>
                </div>

            </div>

        </section>

        <section id="forecastSection" class="forecast-section hidden">

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
                <!-- Forecast cards will be generated by JavaScript -->
            </div>

        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>Weather Dashboard | Advanced Git & DevOps Assignment</p>
        </div>
    </footer>

    <script src="scripts/config.js"></script>
    <script src="scripts/app.js"></script>

</body>
</html>
